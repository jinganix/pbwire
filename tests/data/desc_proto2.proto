// proto2 fixture: required/optional presence, an enum with a negative value and
// a repeated field that must NOT default to packed.
syntax = "proto2";

package pbwire.test;

import "google/protobuf/any.proto";

enum Legacy {
  LEGACY_NONE = 0;
  LEGACY_ONE = 1;
  LEGACY_NEG = -2;
}

message Old {
  required int32 id = 1;
  optional string name = 2 [default = "x"];
  repeated sint64 vals = 3;
  optional Legacy kind = 4;
  optional google.protobuf.Any payload = 5;
  extensions 100 to 199;
  reserved 999;
  reserved "ancient";
}

extend Old {
  optional int32 ext_int = 100 [default = 5];
  optional string ext_str = 101;
}

// Legacy group field: decoded into its submessage like a message field.
message Grouped {
  optional group Inner = 1 {
    optional int32 x = 2;
  }
  optional int32 after = 3;
}
