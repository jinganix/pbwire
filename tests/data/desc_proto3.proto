// proto3 fixture: default packing, an explicit packed = false, a nested message,
// a map (i.e. a repeated entry message), a oneof and a cross-file type
// reference into desc_proto2.proto.
syntax = "proto3";

package pbwire.test;

import "desc_proto2.proto";

enum Color {
  COLOR_UNSPECIFIED = 0;
  COLOR_RED = 1;
}

message Outer {
  int32 plain = 1;
  repeated int32 auto_packed = 2;
  repeated sint32 unpacked = 3 [packed = false];

  message Inner {
    string s = 1;
  }

  Inner inner = 4;
  map<string, int32> tags = 5;

  oneof choice {
    int32 a = 6;
    string b = 7;
  }

  Old legacy = 8;
  Color color = 9;
}
