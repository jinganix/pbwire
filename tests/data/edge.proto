// Shared fixture for the host bindings' self-checks: the cases the binding
// layer can get wrong even when the core is right -- payloads with embedded
// NULs and invalid UTF-8, non-ASCII text, a negative enum, an empty repeated
// element, proto3 optional presence (including an empty value) and oneof
// switching.
//
// Regenerate the pinned bytes with protoc (see tests/data/README.md).
syntax = "proto3";

package edge;

enum Sign {
  SIGN_ZERO = 0;
  SIGN_NEG = -3;
}

message Inner {
  string tag = 1;
  int32 n = 2;
}

message Edge {
  bytes raw = 1;
  string text = 2;
  Sign sign = 3;
  repeated string tags = 4;
  repeated bytes blobs = 5;
  Inner inner = 6;
  optional string maybe = 7;
  oneof choice {
    int32 pick_num = 8;
    string pick_str = 9;
    Inner pick_inner = 10;
  }
}
