// Message used by the differential test and the benchmark against libprotobuf C++.
// bench/bench.cc mirrors this schema by hand; the differential test is what keeps
// the mirror honest.
// Byte payloads are `bytes`, not `string`: this harness compares wire format,
// and pbwire now validates proto3 `string` fields exactly like libprotobuf
// (utf8_validation VERIFY), covered by tests/test_pbwire.c and by the
// proto3-vs-proto2 check in tests/test_descriptor.c.
syntax = "proto3";

package bench;

enum Color {
  COLOR_UNSPECIFIED = 0;
  RED = 1;
  GREEN = 2;
  BLUE = 3;
}

message Child {
  bytes name = 1;
  int64 value = 2;
}

message Msg {
  int32 i32 = 1;
  int64 i64 = 2;
  uint32 u32 = 3;
  uint64 u64 = 4;
  sint32 s32 = 5;
  sint64 s64 = 6;
  fixed32 fx32 = 7;
  fixed64 fx64 = 8;
  sfixed32 sfx32 = 9;
  sfixed64 sfx64 = 10;
  float f32 = 11;
  double f64 = 12;
  bool flag = 13;
  bytes name = 14;
  bytes blob = 15;
  Color color = 16;
  Child child = 17;
  repeated int32 nums = 18 [packed = false];
  repeated int32 packed_nums = 19;
  repeated bytes tags = 20;
  repeated Child kids = 21;
}
