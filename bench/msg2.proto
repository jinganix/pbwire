// proto2 counterpart of bench/msg.proto, used to compare the two syntaxes:
// proto2 has explicit presence for every field (so a field set to its default
// value is serialized), unpacked repetition by default, groups, required
// fields, closed enums, extensions, and default values that pbwire reports
// but does not materialize.
syntax = "proto2";

package bench2;

enum Color2 {
  C2_UNSPECIFIED = 0;
  C2_RED = 1;
  C2_GREEN = 2;
  C2_BLUE = 3;
}

message Child2 {
  optional string name = 1;
  optional int64 value = 2 [default = 7];
}

message Msg2 {
  optional int32 i32 = 1 [default = -5];
  optional int64 i64 = 2;
  optional uint32 u32 = 3;
  optional uint64 u64 = 4;
  optional sint32 s32 = 5;
  optional sint64 s64 = 6;
  optional fixed32 fx32 = 7;
  optional fixed64 fx64 = 8;
  optional sfixed32 sfx32 = 9;
  optional sfixed64 sfx64 = 10;
  optional float f32 = 11;
  optional double f64 = 12;
  optional bool flag = 13;
  optional bytes name = 14;
  optional bytes blob = 15;
  optional Color2 color = 16;
  optional Child2 child = 17;
  repeated int32 nums = 18;
  repeated int32 packed_nums = 19 [packed = true];
  repeated bytes tags = 20;
  repeated Color2 packed_colors = 21 [packed = true];
  extensions 100 to 199;
}

extend Msg2 {
  optional int32 ext_int = 100 [default = 5];
  optional string ext_str = 101;
}

// Groups decode into their submessage like message fields.
message HasGroup {
  optional int32 before = 1;
  optional group Grp = 2 {
    optional int32 x = 3;
  }
  optional int32 after = 4;
}

// `required` is enforced the way the reference does it: the parser refuses
// incomplete data, the serializer writes whatever the tree holds.
message HasRequired {
  required int32 needed = 1;
  optional int32 other = 2;
}
