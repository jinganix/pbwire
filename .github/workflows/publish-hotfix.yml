name: Publish hotfix

# One-off single-binding publish for a tag whose normal Release already ran.
# Failed jobs cannot use `gh run rerun` once the fix lands after the tag
# (reruns reuse the tag's workflow file), and dispatching Release would
# republish every registry. Dispatch with the tag and exactly one binding;
# nothing else runs. The tree published is the dispatch ref, so VERSION must
# still equal the tag (cut no release in between). If the NIF package
# changed, dispatch binding=erlang first, then binding=elixir.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish for (VERSION must still equal it)"
        required: true
        default: "v0.1.12"
      binding:
        description: "Binding to publish"
        required: true
        default: "elixir"
        type: choice
        options: [elixir, erlang, cocoapods]

jobs:
  erlang:
    name: Hex (bindings/erlang, replace)
    if: inputs.binding == 'erlang'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tree must still be the tag's version
        run: |
          ver="$(tr -d ' \t\n' < VERSION)"
          [ "v$ver" = "${{ inputs.tag }}" ] || { echo "VERSION $ver != ${{ inputs.tag }}, refusing" >&2; exit 1; }
          ./scripts/sync-versions.sh --check
      - uses: erlef/setup-beam@v1.24.0
        with:
          otp-version: "29"
          version-type: loose
      - name: Publish (replace the broken tarball)
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          [ -n "$HEX_API_KEY" ] || { echo "HEX_API_KEY unset, skipping"; exit 0; }
          # --replace overwrites the already-published VERSION with the fixed
          # tree (vendored C core); a no-op when the version is not on Hex yet.
          (cd bindings/erlang && make ./rebar3 >/dev/null && ./rebar3 hex publish --replace --yes)

  elixir:
    name: Hex (bindings/elixir)
    if: inputs.binding == 'elixir'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tree must still be the tag's version
        run: |
          ver="$(tr -d ' \t\n' < VERSION)"
          [ "v$ver" = "${{ inputs.tag }}" ] || { echo "VERSION $ver != ${{ inputs.tag }}, refusing" >&2; exit 1; }
          ./scripts/sync-versions.sh --check
      - uses: erlef/setup-beam@v1.24.0
        with:
          otp-version: "29"
          elixir-version: "1.20"
          version-type: loose
      - name: Publish
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          [ -n "$HEX_API_KEY" ] || { echo "HEX_API_KEY unset, skipping"; exit 0; }
          # The image ships its own Erlang/Elixir; setup-beam's pair must win.
          # Absolute paths leave no doubt which mix runs. The committed
          # mix.lock pins :pbwire to an older line, so update to the
          # just-published VERSION instead of fetching the lock.
          MIX="$INSTALL_DIR_FOR_ELIXIR/bin/mix"
          # deps.get first: deps.update only touches :pbwire, and Hex refuses
          # to publish while any other dependency is unfetched.
          (cd bindings/elixir && "$MIX" deps.get && "$MIX" deps.update pbwire &&
            "$MIX" hex.publish --yes)

  cocoapods:
    name: CocoaPods (bindings/objc)
    if: inputs.binding == 'cocoapods'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tree must still be the tag's version
        run: |
          ver="$(tr -d ' \t\n' < VERSION)"
          [ "v$ver" = "${{ inputs.tag }}" ] || { echo "VERSION $ver != ${{ inputs.tag }}, refusing" >&2; exit 1; }
          ./scripts/sync-versions.sh --check
      - name: Push podspec
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          [ -n "$COCOAPODS_TRUNK_TOKEN" ] || { echo "COCOAPODS_TRUNK_TOKEN unset, skipping"; exit 0; }
          # pod trunk push validates the podspec through the GitHub commit
          # API, which times out now and then; retry before failing the job.
          # A duplicate means an earlier attempt already landed it.
          for i in 1 2 3; do
            out=$(cd bindings/objc && pod trunk push PBWire.podspec --allow-warnings 2>&1) && { printf '%s\n' "$out"; exit 0; }
            printf '%s\n' "$out" >&2
            case "$out" in
              *"duplicate entry"*) echo "PBWire $(tr -d ' \t\n' < VERSION) already published"; exit 0 ;;
            esac
            echo "retrying (attempt $i)" >&2
            sleep 60
          done
          exit 1
