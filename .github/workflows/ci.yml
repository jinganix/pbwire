name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  commit-msg:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate commit messages
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}...${{ github.sha }}"
          else
            RANGE="HEAD~1..HEAD"
          fi
          for c in $(git log --format=%H "$RANGE"); do
            git show -s --format=%B "$c" > /tmp/pbwire-commit-msg
            echo "--- $c: $(head -n 1 /tmp/pbwire-commit-msg)"
            ./scripts/validate-commit-msg.sh /tmp/pbwire-commit-msg
          done

  test:
    name: make test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Build and self-check
        run: make test

  warnings:
    name: warnings as errors (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - name: Build and self-check with ${{ matrix.cc }}
        # Same -Werror gate as the Makefile, on a second compiler so
        # Linux-only gcc/clang warnings fail here instead of on macOS.
        run: CC=${{ matrix.cc }} make test

  cmake:
    name: CMake build + ctest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build-cmake
      - name: Build
        run: cmake --build build-cmake
      - name: Test
        # -C selects the configuration for multi-config generators
        # (Visual Studio); single-config generators ignore it.
        run: ctest --test-dir build-cmake --output-on-failure -C Debug

  conformance:
    name: Official conformance suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache pinned protobuf checkout and runner
        uses: actions/cache@v4
        with:
          path: .tmp/
          # PROTOBUF_VERSION is pinned in the Makefile, so any bump
          # naturally invalidates the cache.
          key: conformance-${{ hashFiles('Makefile') }}
      - name: Clone pinned protobuf, build runner + protoc
        # CMAKE_BUILD_PARALLEL_LEVEL is honored by cmake --build, so the
        # Makefile stays untouched. protoc comes from the same checkout,
        # so it always understands the edition golden files.
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=$(nproc) make conformance-setup
          PB_SRC=$(echo .tmp/protobuf-*)
          CMAKE_BUILD_PARALLEL_LEVEL=$(nproc) cmake --build "$PB_SRC/build" --target protoc
          echo "PB_SRC=$PB_SRC" >> "$GITHUB_ENV"
      - name: Run the suite through the C testee
        run: PROTOC="$PB_SRC/build/protoc" make conformance

  versions:
    name: Versions consistent with VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Every manifest matches VERSION
        run: ./scripts/sync-versions.sh --check

  docs-sync:
    name: llms.txt names every public API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: API index in sync
        run: ./scripts/check-llms.sh

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install clang-format
        # apt ships clang-format 18 on 24.04; the tree needs >= 19.
        run: sudo apt-get update && sudo apt-get install -y clang-format-20
      - name: Check C formatting
        run: |
          sudo ln -sf /usr/bin/clang-format-20 /usr/local/bin/clang-format
          make format-check

  codegen:
    name: Generated models (regenerate + Python, Node, Ruby, PHP checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - name: Cache pinned protobuf checkout and protoc
        uses: actions/cache@v4
        with:
          path: .tmp/
          # PROTOBUF_VERSION is pinned in the Makefile, so any bump
          # naturally invalidates the cache.
          key: conformance-${{ hashFiles('Makefile') }}
      - name: Build pinned protoc
        # The committed oracle files (gen_oracle) are produced by the pinned
        # protobuf release, not by apt's protoc: regenerating with anything
        # else prints a diff and fails the gate below.
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=$(nproc) make conformance-setup
          PB_SRC=$(echo $PWD/.tmp/protobuf-*)
          CMAKE_BUILD_PARALLEL_LEVEL=$(nproc) cmake --build "$PB_SRC/build" --target protoc
          echo "PB_SRC=$PB_SRC" >> "$GITHUB_ENV"
          # The PHP compat test shells out to bare `protoc --version`;
          # point PATH at the pinned build so it sees 36.2, not apt's.
          echo "$PB_SRC/build" >> "$GITHUB_PATH"
      - name: Install language baselines
        # The compat tests pin their baselines (see each binding's
        # testdata/ORACLES.md); the runner image does not provide them.
        run: |
          gem install google-protobuf -v 4.36.2 --no-document
          pip install "protobuf==7.36.2"
          (cd bindings/node && npm install --prefix benchmarks --no-save --no-package-lock --no-audit --no-fund protobufjs@8.8.1)
          sudo apt-get update && sudo apt-get install -y php-cli
      - name: Check the codegen plugin's formatting
        run: |
          out=$(gofmt -l codegen)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: Committed models are up to date
        run: |
          PROTOC="$PB_SRC/build/protoc" make codegen
          git diff --exit-code
      - name: Generated model tests (Ruby, PHP, Node, Python)
        run: make -C codegen test-ruby test-php test-node test-python

  go:
    name: Go binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: false
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Check Go formatting
        run: |
          out=$(gofmt -l bindings/go)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: cgo dynamic binding tests
        run: make go-test

  ruby:
    name: Ruby binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Build the extension and run the self-check
        run: make ruby-test

  erlang:
    name: Erlang binding (OTP 29 on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1.24.0
        with:
          otp-version: '29'
          version-type: loose
      - name: Erlang unit tests (EUnit + PropEr parity)
        run: make -C bindings/erlang tests
      - name: NIF C unit tests
        run: make -C bindings/erlang c-tests

  sanitizers:
    name: ASan+UBSan self-check + fuzz corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: make test under ASan/UBSan
        run: >
          make test
          CFLAGS="-O1 -std=c99 -Wall -Wextra -Werror -pedantic -fPIC -g
          -fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: fuzz corpus under ASan/UBSan
        run: >
          make build/fuzz_decode
          CFLAGS="-O1 -std=c99 -Wall -Wextra -Werror -pedantic -fPIC -g
          -fsanitize=address,undefined -fno-omit-frame-pointer"
          && make fuzz

  tsan:
    name: ThreadSanitizer threads gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: test_threads under TSan
        run: >
          make build/test_threads
          CFLAGS="-O1 -std=c99 -Wall -Wextra -Werror -pedantic -fPIC -g
          -fsanitize=thread -fno-omit-frame-pointer"
          && PBW_SKIP_SCALE=1 ./build/test_threads

  binding-asan:
    name: Binding extensions under ASan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install the Node compat oracle
        run: (cd bindings/node && npm install --prefix benchmarks --no-save --no-package-lock --no-audit --no-fund protobufjs@8.8.1)
      - name: ASan core + extensions, run their suites
        # The recipe is verified in docs (local docker): the core archive is
        # built instrumented first, then each extension links it in and runs
        # under LD_PRELOAD. Python's interpreter is LSan-clean so leaks stay
        # on there (it caught a Schema/MessageType cycle); Ruby and Node
        # leak on their own (even `ruby -e exit`), so they run ASan-only.
        run: |
          ASAN="-O1 -std=c99 -Wall -Wextra -Werror -pedantic -fPIC -g -fsanitize=address -fno-omit-frame-pointer"
          make build/libpbwire.a CC=gcc CFLAGS="$ASAN"
          make python-bind CC=gcc CFLAGS="$ASAN"
          # Preload only for the interpreter that loads the extension: a global
          # LD_PRELOAD also instruments gcc/cc1, which then fails its own
          # leak check.
          export LD_PRELOAD=$(gcc -print-file-name=libasan.so)
          python3 bindings/python/tests/test_pbwire.py
          export ASAN_OPTIONS=detect_leaks=0
          # Interpreter headers are C2X; no -std/-pedantic/-Werror here.
          EXTRA="-fsanitize=address -fno-omit-frame-pointer -g"
          PBW_EXTRA_CFLAGS="$EXTRA" make ruby-test
          PBW_EXTRA_CFLAGS="$EXTRA" CC=gcc make node-test

  ports:
    name: 32-bit and big-endian (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [i386, s390x]
    steps:
      - uses: actions/checkout@v5
      - name: Install the toolchain
        run: |
          sudo apt-get update
          if [ "${{ matrix.target }}" = i386 ]; then
            sudo apt-get install -y gcc-multilib libc6-dev-i386
          else
            sudo apt-get install -y gcc-s390x-linux-gnu qemu-user-static
          fi
      - name: 32-bit self-check (ILP32, native)
        if: matrix.target == 'i386'
        run: make port-test-32
      - name: Big-endian self-check (s390x, qemu-user)
        if: matrix.target == 's390x'
        run: ./scripts/check-ports.sh

  api-docs:
    name: API reference (Doxygen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen
      - name: Render the public headers
        run: make api-docs
      - name: Upload the HTML reference
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: build/doxygen/html

  difftest-short:
    name: Differential test (fixed seed, 2000 cases)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache pinned protobuf checkout and runner
        uses: actions/cache@v4
        with:
          path: .tmp/
          key: conformance-${{ hashFiles('Makefile') }}
      - name: Build the pinned reference (protoc + libprotobuf)
        # The baseline is the pinned checkout, not the distro's protobuf: the
        # verdict-parity checks are calibrated against PROTOBUF_VERSION.
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=$(nproc) make conformance-setup
          PB_SRC=$(echo .tmp/protobuf-*)
          CMAKE_BUILD_PARALLEL_LEVEL=$(nproc) cmake --build "$PB_SRC/build" \
            --target protoc libprotobuf
          echo "PB_SRC=$PB_SRC" >> "$GITHUB_ENV"
      - name: Short differential run
        # abseil ships inside the checkout, not as a system include.
        run: make difftest-short PROTOC="$PB_SRC/build/protoc" PB_CXXFLAGS="-I$PB_SRC/src -I$PB_SRC/third_party/abseil-cpp" PB_LIBS="-L$PB_SRC/build -lprotobuf"
        env:
          LD_LIBRARY_PATH: ${{ env.PB_SRC }}/build

  fuzz-short:
    name: Fuzz corpus replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Replay the fixed corpus
        run: make fuzz

  coverage:
    name: Core coverage floor (floor lives in the Makefile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: gcov over the core
        run: make coverage

  release-check:
    name: Release dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Dry-run the release gate
        run: ./scripts/release-check.sh --offline
