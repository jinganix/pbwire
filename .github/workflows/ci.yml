name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  commit-msg:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate commit messages
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}...${{ github.sha }}"
          else
            RANGE="HEAD~1..HEAD"
          fi
          for c in $(git log --format=%H "$RANGE"); do
            git show -s --format=%B "$c" > /tmp/pbwire-commit-msg
            echo "--- $c: $(head -n 1 /tmp/pbwire-commit-msg)"
            ./scripts/validate-commit-msg.sh /tmp/pbwire-commit-msg
          done

  test:
    name: make test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Build and self-check
        run: make test

  cmake:
    name: CMake build + ctest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build-cmake
      - name: Build
        run: cmake --build build-cmake
      - name: Test
        run: ctest --test-dir build-cmake --output-on-failure

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install clang-format
        # apt ships clang-format 18 on 24.04; the tree needs >= 19.
        run: sudo apt-get update && sudo apt-get install -y clang-format-20
      - name: Check C formatting
        run: |
          sudo ln -sf /usr/bin/clang-format-20 /usr/local/bin/clang-format
          make format-check

  typed:
    name: Typed models (regenerate + Python, Node, Ruby, PHP checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Check the typed plugin's formatting
        run: |
          out=$(gofmt -l bindings/typed)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: Committed models are up to date
        run: |
          make typed-gen
          git diff --exit-code
      - name: Typed model tests (Ruby, PHP, Node, Python)
        run: make -C bindings/typed test-ruby test-php test-node test-python

  go:
    name: Go binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Check Go formatting
        run: |
          out=$(gofmt -l bindings/go)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: cgo dynamic binding tests
        run: make go-test

  ruby:
    name: Ruby binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Build the extension and run the self-check
        run: make ruby-test

  erlang:
    name: Erlang binding (OTP 29 on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1.24.0
        with:
          otp-version: '29'
          version-type: loose
      - name: Erlang unit tests (EUnit + PropEr parity)
        run: make -C bindings/erlang tests
      - name: NIF C unit tests
        run: make -C bindings/erlang c-tests
