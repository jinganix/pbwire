name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    name: make test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Build and self-check
        run: make test

  cmake:
    name: CMake build + ctest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build-cmake
      - name: Build
        run: cmake --build build-cmake
      - name: Test
        run: ctest --test-dir build-cmake --output-on-failure

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install clang-format
        # apt ships clang-format 18 on 24.04; the tree needs >= 19.
        run: sudo apt-get update && sudo apt-get install -y clang-format-20
      - name: Check C formatting
        run: |
          sudo ln -sf /usr/bin/clang-format-20 /usr/local/bin/clang-format
          make format-check

  go:
    name: Go binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          # The generator module's protobuf-go dependency needs Go >= 1.23.
          go-version: '1.23'
      - name: Check Go formatting
        run: |
          out=$(gofmt -l bindings/go)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: Generated-code, runtime and plugin tests
        run: make go-test

  ruby:
    name: Ruby binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Build the extension and run the self-check
        run: make ruby-test

  erlang:
    name: Erlang binding (OTP 29 on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1.24.0
        with:
          otp-version: '29'
          version-type: loose
      - name: Erlang unit tests (EUnit + PropEr parity)
        run: make -C bindings/erlang tests
      - name: NIF C unit tests
        run: make -C bindings/erlang c-tests
