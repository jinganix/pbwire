name: Release

# Cut a release by bumping VERSION, running scripts/sync-versions.sh,
# committing the result, then tagging: git tag v$(cat VERSION); git push --tags
# Every registry publish below is skipped (not failed) when its secret or
# setup is missing, so a partially-configured release still ships the rest.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Tag matches VERSION, versions consistent, core green
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag must equal v$(cat VERSION)
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="$(tr -d ' \t\n' < VERSION)"
          [ "$tag" = "v$ver" ] || { echo "tag $tag != VERSION v$ver" >&2; exit 1; }
      - name: Versions consistent
        run: ./scripts/sync-versions.sh --check
      - name: Core gate
        run: make test

  github-release:
    name: GitHub release + C tarball
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create release and upload tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="$(tr -d ' \t\n' < VERSION)"
          git archive --format=tar.gz --prefix="pbwire-$ver/" \
            -o "/tmp/pbwire-$ver.tar.gz" "v$ver"
          if gh release view "v$ver" >/dev/null 2>&1; then
            gh release upload "v$ver" "/tmp/pbwire-$ver.tar.gz" --clobber
          else
            gh release create "v$ver" "/tmp/pbwire-$ver.tar.gz" \
              --title "v$ver" --generate-notes
          fi

  protoc-plugins:
    name: protoc plugins (typed + C)
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: false
      - name: Cross-compile both plugins
        env:
          CGO_ENABLED: "0"
        run: |
          set -e
          mkdir -p /tmp/plugins
          for os_arch in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64" "windows amd64"; do
            set -- $os_arch
            os=$1; arch=$2
            suffix=""; [ "$os" = windows ] && suffix=".exe"
            (cd bindings/typed && GOOS=$os GOARCH=$arch go build -o "/tmp/plugins/protoc-gen-pbwire-typed-$os-$arch$suffix" ./cmd/protoc-gen-pbwire-typed)
            (cd bindings/c/plugin && GOOS=$os GOARCH=$arch go build -o "/tmp/plugins/protoc-gen-pbwire-c-$os-$arch$suffix" ./cmd/protoc-gen-pbwire-c)
          done
          ls -la /tmp/plugins
      - name: Upload to this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="$(tr -d ' \t\n' < VERSION)"
          gh release upload "v$ver" /tmp/plugins/* --clobber

  pypi:
    name: PyPI (bindings/python, OIDC)
    needs: validate
    # Pinned to 22.04 (glibc 2.35): the wheel is repaired to manylinux_2_35,
    # installable on 22.04+; a 24.04 build would demand glibc 2.39+.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build a manylinux wheel
        run: |
          # PyPI rejects plain linux_x86_64 wheels; auditwheel relabels ours
          # (C extension, libc only) to manylinux_2_35.
          python -m pip install build auditwheel patchelf
          (cd bindings/python && python -m build)
          mkdir -p dist && cp bindings/python/dist/*.tar.gz dist/
          auditwheel repair bindings/python/dist/*.whl -w dist/
      - name: Publish
        # Trusted Publishing (pending publisher on PyPI, workflow release.yml,
        # no environment): mints an OIDC token, no API secret needed.
        uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    name: npm (bindings/node)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          [ -n "$NPM_TOKEN" ] || { echo "NPM_TOKEN unset, skipping"; exit 0; }
          (cd bindings/node && npm publish --access public)

  rubygems:
    name: RubyGems (bindings/ruby)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Build and push
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          [ -n "$RUBYGEMS_API_KEY" ] || { echo "RUBYGEMS_API_KEY unset, skipping"; exit 0; }
          mkdir -p ~/.gem && printf -- "---\n:rubygems_api_key: %s\n" "$RUBYGEMS_API_KEY" > ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          (cd bindings/ruby && gem build pbwire.gemspec && gem push "pbwire-$(tr -d ' \t\n' < ../../VERSION).gem")

  crates:
    name: crates.io (bindings/rust)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Publish
        env:
          CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: |
          [ -n "$CARGO_TOKEN" ] || { echo "CARGO_TOKEN unset, skipping"; exit 0; }
          make all
          (cd bindings/rust && cargo publish --token "$CARGO_TOKEN")

  hex:
    name: Hex (bindings/erlang)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1.24.0
        with:
          otp-version: "29"
          version-type: loose
      - name: Publish
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          [ -n "$HEX_API_KEY" ] || { echo "HEX_API_KEY unset, skipping"; exit 0; }
          # The escript is gitignored and bootstrapped by the Makefile, same
          # as every local build; hex_core picks the key up from HEX_API_KEY.
          (cd bindings/erlang && make ./rebar3 >/dev/null && ./rebar3 hex publish --yes)

  luarocks:
    name: LuaRocks (bindings/lua)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build from the tag tarball, then upload the rockspec
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        run: |
          [ -n "$LUAROCKS_API_KEY" ] || { echo "LUAROCKS_API_KEY unset, skipping"; exit 0; }
          sudo apt-get update && sudo apt-get install -y luarocks lua5.4 liblua5.4-dev lua-dkjson
          ver="$(tr -d ' \t\n' < VERSION)"
          # Installs from source.url (the tag tarball above), exactly what
          # users get; fails the job if the C sources do not compile.
          luarocks build --lua-version=5.4 --local "bindings/lua/pbwire-$ver-1.rockspec"
          luarocks upload --api-key "$LUAROCKS_API_KEY" "bindings/lua/pbwire-$ver-1.rockspec"

  nuget:
    name: NuGet (bindings/csharp)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Pack and push
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          [ -n "$NUGET_API_KEY" ] || { echo "NUGET_API_KEY unset, skipping"; exit 0; }
          dotnet pack bindings/csharp/Pbwire/Pbwire.csproj -c Release
          dotnet nuget push "bindings/csharp/Pbwire/bin/Release/*.nupkg" \
            --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  pub:
    name: pub.dev (bindings/dart, OIDC)
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
      - name: Publish
        run: |
          (cd bindings/dart && dart pub publish --force)

  maven:
    name: Maven Central (bindings/java, bindings/kotlin)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          java-version: "22"
          distribution: temurin
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
      - name: Deploy java then kotlin
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          [ -n "$MAVEN_USERNAME" ] || { echo "Maven secrets unset, skipping"; exit 0; }
          (cd bindings/java && mvn -B deploy -DskipTests)
          # Kotlin resolves pbwire-java from Central, which lags publishes:
          # install it into this runner's local repo first.
          (cd bindings/java && mvn -B install -DskipTests -Dgpg.skip=true)
          (cd bindings/kotlin && mvn -B deploy -DskipTests)

  cocoapods:
    name: CocoaPods (bindings/objc)
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Push podspec
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          [ -n "$COCOAPODS_TRUNK_TOKEN" ] || { echo "COCOAPODS_TRUNK_TOKEN unset, skipping"; exit 0; }
          (cd bindings/objc && pod trunk push PBWire.podspec --allow-warnings)
