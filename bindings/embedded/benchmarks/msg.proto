// The embedded comparison message: fixed-size fields only, so nanopb can
// generate a purely static struct (no callbacks, no malloc) and both sides
// measure the same work. `make embedded-bench` runs it; msg.options pins the
// nanopb caps.
syntax = "proto3";

package eb;

message Reading {
  int32 id = 1;
  uint64 ts = 2;
  float temp = 3;
  double pressure = 4;
  bool ok = 5;
  string label = 6;
  bytes raw = 7;
  repeated int32 samples = 8;
}
