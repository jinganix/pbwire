[package]
name = "pbwire-bench"
version = "0.1.19"
edition = "2021"
publish = false

[dependencies]
# `core` turns on the pure-Rust codec (`../src/core/`) for the third pbench arm;
# the crate still links the C core, so the tree and shim rows are unchanged.
pbwire = { path = "..", features = ["core"] }
protobuf = "3"
prost = "0.14"

[build-dependencies]
prost-build = "0.14"

[[bin]]
name = "bench"
path = "src/main.rs"
