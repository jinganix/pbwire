// Fixture for the Java binding's coverage test: WKT-shaped messages plus
// an RPC service with all four streaming combinations.
syntax = "proto3";

package pbwire.test;

message Stamp {
  int64 seconds = 1;
  int32 nanos = 2;
}

message AnyMsg {
  string type_url = 1;
  bytes value = 2;
}

message Mask {
  repeated string paths = 1;
}

message Node {
  int32 v = 1;
  Node next = 2;
}

message SearchRequest {
  string query = 1;
  int32 limit = 2;
}

message SearchResponse {
  repeated string hits = 1;
}

service Search {
  rpc Find(SearchRequest) returns (SearchResponse);
  rpc Watch(stream SearchRequest) returns (stream SearchResponse);
}
