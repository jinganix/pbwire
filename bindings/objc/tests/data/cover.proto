// Coverage fixture for the Objective-C binding self-check: WKT mirrors
// (only field numbers matter to the binary helpers, so these stand in for
// the real google.protobuf types) plus one service for the schema service
// helpers. Regenerate the descriptor set next to it with:
//   protoc -Ibindings/objc/tests/data \
//       --descriptor_set_out=bindings/objc/tests/data/cover.desc \
//       bindings/objc/tests/data/cover.proto
syntax = "proto3";

package pbwobjc;

message AnyBox {
  string type_url = 1;
  bytes value = 2;
}

message Stamp {
  int64 seconds = 1;
  int32 nanos = 2;
}

message Span {
  int64 seconds = 1;
  int32 nanos = 2;
}

message Mask {
  repeated string paths = 1;
}

service Lookup {
  rpc Get(Stamp) returns (Stamp);
}
