// Struct-binding coverage matrix (proto3): every scalar kind the
// pbw_struct engine supports, plus string/enum/message, repetition and
// proto3 optional. All singular scalars carry non-zero values in
// matrix3.txt on purpose: proto3 implicit presence has no has-flag, so
// the struct encoder always emits them and the reference bytes
// (protoc --encode, the same oracle as the conformance suite) must too.
syntax = "proto3";

package structtest;

enum Color3 {
  COLOR3_UNSPECIFIED = 0;
  COLOR3_RED = 1;
  COLOR3_GREEN = 2;
}

message Inner3 {
  string name = 1;
  int32 value = 2;
}

message Scalars3 {
  int32 i32 = 1;
  int64 i64 = 2;
  uint32 u32 = 3;
  uint64 u64 = 4;
  sint32 s32 = 5;
  sint64 s64 = 6;
  fixed32 fx32 = 7;
  fixed64 fx64 = 8;
  sfixed32 sfx32 = 9;
  sfixed64 sfx64 = 10;
  float f32 = 11;
  double f64 = 12;
  bool flag = 13;
  string str = 14;
  Color3 color = 15;
  Inner3 inner = 16;
  repeated int32 nums = 17;
  repeated string tags = 18;
  repeated Inner3 inners = 19;
  optional int32 opt_i32 = 20;
  optional string opt_str = 21;
  repeated bool flags = 22;
}
