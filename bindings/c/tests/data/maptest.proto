// Struct-binding map coverage: every map shape the plugin generates is a
// repeated entry struct (no hash table). The struct encoder writes entries
// in array order and the reference bytes (protoc --encode from maptest.txt,
// the same oracle as the conformance suite) must match. Keep the .txt entry
// order identical to the fill order in test_struct.c: plain encode preserves
// array order, it does not sort.
syntax = "proto3";

package structtest;

message MapValue {
  string name = 1;
  int32 value = 2;
}

message Maps {
  map<int32, string> by_int = 1;
  map<string, int32> by_str = 2;
  map<string, MapValue> by_msg = 3;
}
