name: pbwire
description: Dynamic protobuf over the pbwire C ABI, schema at runtime, no generated code.
version: 0.1.16
repository: https://github.com/jinganix/pbwire

environment:
  # NativeCallable (sync FFI callbacks, used by visit) is 3.1+.
  sdk: ^3.1.0

dependencies:
  ffi: ^2.1.0
  # Generated facades (tests/gen): Int64 fields and ProtobufEnum enums mirror
  # protoc-gen-dart exactly; the wire itself stays in the C core.
  fixnum: ^1.1.0
  protobuf: ^6.1.0
