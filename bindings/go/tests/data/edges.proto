// Go binding edge cases the shared matrix protos do not carry: bytes with
// implicit and explicit presence, -0.0, and a recursive message for the
// nesting cap. Reference bytes (edges.bin) come from protoc --encode on
// edges.txt, same oracle as the C fixtures.
syntax = "proto3";

package edgetest;

message Edges {
  bytes data = 1;
  optional bytes opt_data = 2;
  repeated bytes chunks = 3;
  optional int32 opt_num = 4;
  repeated int32 packed = 5;
  repeated int32 unpacked = 6 [packed = false];
  float f32 = 7;
  double f64 = 8;
  uint64 u64 = 9;
  string str = 10;
  repeated bool flags = 11;
  repeated float floats = 12;
  repeated double doubles = 13;
}

message Node {
  int32 value = 1;
  Node next = 2;
  repeated Node kids = 3;
  bytes payload = 4;
}
