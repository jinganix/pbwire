# pbnginx demo: listen :8080, reverse-proxy /pb/ to pbgateway on 127.0.0.1:8081.
worker_processes 1; # single worker is enough for the demo
error_log /tmp/pbnginx_error.log; # writable log outside the repo
pid /tmp/pbnginx.pid; # writable pid outside the repo
events { worker_connections 64; } # connection cap for the demo
http { # minimal http context
access_log off; # keep the demo quiet
upstream gateway { server 127.0.0.1:8081; } # pbgateway origin
server { # demo front door
listen 8080; # public port used by pbcurl
location /pb/ { # fixed-path RPCs only
proxy_pass http://gateway; # forward to pbgateway
proxy_connect_timeout 2s; # fail fast when gateway is down
proxy_read_timeout 5s; # echo replies are instant
proxy_send_timeout 5s; # requests are tiny
} # end location
} # end server
} # end http
